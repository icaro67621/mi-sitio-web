<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>VulnBank · Demo (versión remediada)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ciberseguridad/ciber.css" />

  <!-- Remediado: sin jQuery vulnerable. Los scripts propios se cargan desde
       el propio origen y funcionan bajo una CSP estricta. -->
  <script src="/ciberseguridad/lab/assets/config.js"></script>
  <script src="/ciberseguridad/lab/assets/app.js"></script>
</head>
<body>

<nav>
  <a class="brand" href="/ciberseguridad/lab/">VULN<span>BANK</span></a>
  <div class="nav-links">
    <a href="/ciberseguridad/lab/">← Volver al lab</a>
  </div>
</nav>

<section class="hero hero-small">
  <div class="hero-text">
    <p class="kicker">&gt; demo bancaria de entrenamiento · versión remediada</p>
    <h1>Vuln<span>Bank</span></h1>
    <!-- Remediado: el banner se rellena con textContent (ver app.js). -->
    <div id="banner" class="section-sub"></div>
  </div>
</section>

<section class="section">
  <div class="grid">
    <!-- Acceso -->
    <div class="card">
      <span class="badge">ACCESO</span>
      <h3>Entrar</h3>
      <!-- Remediado: sin credenciales en el cliente; se valida en el servidor. -->
      <form id="form-login">
        <p><input name="usuario" placeholder="Usuario" autocomplete="off"></p>
        <p><input name="clave" type="password" placeholder="Contraseña" autocomplete="off"></p>
        <p><button class="btn btn-primary" type="submit">Iniciar sesión</button></p>
        <p id="login-msg" class="section-sub"></p>
      </form>
    </div>

    <!-- Búsqueda -->
    <div class="card">
      <span class="badge">BUSCAR</span>
      <h3>Buscar movimientos</h3>
      <!-- Remediado: el resultado se pinta con textContent. -->
      <form id="form-buscar">
        <p><input id="q" name="q" placeholder="Ej: transferencia"></p>
        <p><button class="btn btn-ghost" type="submit">Buscar</button></p>
      </form>
      <div id="resultado" class="section-sub"></div>
    </div>

    <!-- Calculadora -->
    <div class="card">
      <span class="badge">CUOTAS</span>
      <h3>Calculadora de cuotas</h3>
      <!-- Remediado: evaluador aritmético acotado, sin eval. -->
      <form id="form-calc">
        <p><input id="expr" name="expr" placeholder="Ej: 1000/12"></p>
        <p><button class="btn btn-ghost" type="submit">Calcular</button></p>
      </form>
      <div id="calc-out" class="section-sub"></div>
    </div>
  </div>

  <div class="card mt-22">
    <span class="badge">RECURSOS</span>
    <h3>Documentación</h3>
    <!-- Remediado: enlace externo con rel="noopener noreferrer". -->
    <p><a href="https://owasp.org/www-project-top-ten/" target="_blank" rel="noopener noreferrer">OWASP Top 10</a></p>
  </div>
</section>

<footer>
  <span class="brand">VULN<span>BANK</span></span>
  <small>Demo de entrenamiento · versión remediada</small>
</footer>

</body>
</html>
